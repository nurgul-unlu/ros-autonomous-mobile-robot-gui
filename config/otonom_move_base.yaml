controller_frequency: 8.0
planner_frequency: 1.0
shutdown_costmaps: false

base_global_planner: "navfn/NavfnROS"
base_local_planner: "dwa_local_planner/DWAPlannerROS"

NavfnROS:
  allow_unknown: true

DWAPlannerROS:
  max_vel_x: 0.18
  min_vel_x: 0.06

  max_vel_theta: 0.6
  min_vel_theta: 0.0

  acc_lim_x: 0.6
  acc_lim_theta: 1.0

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.30
  latch_xy_goal_tolerance: true

  sim_time: 1.5
  vx_samples: 8
  vth_samples: 16

  path_distance_bias: 24.0
  goal_distance_bias: 18.0
  occdist_scale: 0.02

  oscillation_reset_dist: 0.10

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  static_map: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation,    type: "costmap_2d::InflationLayer"}
  inflation:
    inflation_radius: 0.45


local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  static_map: false
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05
  plugins:
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  inflation:
    inflation_radius: 0.35

